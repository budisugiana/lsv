const FILTER_DEFS = [
  {id:"filterProgram", field:"program", label:"Semua Program"},
  {id:"filterUnit", field:"unit", label:"Semua Unit"},
  {id:"filterStatusPP", field:"status_pp", label:"Semua Status PP"},
  {id:"filterStatusLokasi", field:"status_lokasi", label:"Semua Status Lokasi"}
];

function buildFilters() {
  const wrap = document.getElementById("filtersWrap");
  if (!wrap) return;
  
  // Create selects if they don't exist
  FILTER_DEFS.forEach(fd => {
    if (!document.getElementById(fd.id)) {
      const sel = document.createElement("select");
      sel.id = fd.id;
      wrap.insertBefore(sel, document.getElementById("searchInput"));
    }
    buildSelect(fd.id, unique(fd.field), fd.label);
  });
}

function applyFilters() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const activeFilters = FILTER_DEFS.map(fd => ({field: fd.field, val: document.getElementById(fd.id).value}));
  
  filteredData = allData.filter(r => {
    for (let f of activeFilters) {
      if (f.val && r[f.field] !== f.val) return false;
    }
    if (q) {
      const hay = ["no_pp", "nama_pp", "program", "course_title", "uic"].map(k => String(r[k] ?? "").toLowerCase()).join(" ");
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  packets.forEach(pk => pk.currentPage = 1);
  render();
}

function resetFilters() {
  FILTER_DEFS.forEach(fd => {
    const el = document.getElementById(fd.id);
    if (el) el.value = "";
  });
  document.getElementById("searchInput").value = "";
  applyFilters();
}

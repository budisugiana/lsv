<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyJoZ2eU7rcPjoiQDERgrwAu2_wSL-AQ9wP46-7neFspaXYIVHDyD4F1p6q4XCBWVMx/exec";
const API_KEY = "2026-BNU-KARTUKONTROL";
const SHEET_NAME = "kelas";
const PAGE_SIZE = 100;

const FIELD_DEFS = [
  {key:"id_class", label:"ID Class", type:"text", group:"Data Kelas"},
  {key:"nama_pelatihan", label:"Nama Pelatihan", type:"text", group:"Data Kelas"},
  {key:"pic_lc", label:"PIC LC", type:"text", group:"Data Kelas"},
  {key:"nama", label:"Nama", type:"text", group:"Data Kelas"},
  {key:"status_kelas", label:"Status Kelas", type:"text", group:"Kategori"},
  {key:"metode", label:"Metode", type:"text", group:"Kategori"},
  {key:"academy", label:"Academy", type:"text", group:"Kategori"},
  {key:"unit", label:"Unit", type:"text", group:"Kategori"},
  {key:"lokasi", label:"Lokasi", type:"text", group:"Kategori"}
];
const GROUPS = ["Data Kelas", "Kategori"];

function buildFilters(){
  buildSelect("filterStatus", unique("status_kelas"), "Semua Status");
  buildSelect("filterMetode", unique("metode"), "Semua Metode");
  buildSelect("filterAcademy", unique("academy"), "Semua Academy");
  buildSelect("filterUnit", unique("unit"), "Semua Unit");
  buildSelect("filterLokasi", unique("lokasi"), "Semua Lokasi");
}

function applyFilters(){
  const status=document.getElementById("filterStatus").value;
  const metode=document.getElementById("filterMetode").value;
  const academy=document.getElementById("filterAcademy").value;
  const unit=document.getElementById("filterUnit").value;
  const lokasi=document.getElementById("filterLokasi").value;
  const q=document.getElementById("searchInput").value.trim().toLowerCase();

  filteredData=allData.filter(r=>{
    if(status && r.status_kelas!==status)return false;
    if(metode && r.metode!==metode)return false;
    if(academy && r.academy!==academy)return false;
    if(unit && r.unit!==unit)return false;
    if(lokasi && r.lokasi!==lokasi)return false;
    if(q){
      const hay=["id_class","nama_pelatihan","pic_lc","nama","academy"].map(k=>String(r[k]??"").toLowerCase()).join(" ");
      if(!hay.includes(q))return false;
    }
    return true;
  });
  packets.forEach(pk => pk.currentPage = 1);
  render();
}

function resetFilters(){
  ["filterStatus","filterMetode","filterAcademy","filterUnit","filterLokasi"].forEach(id=> {
    const el = document.getElementById(id);
    if(el) el.value="";
  });
  document.getElementById("searchInput").value="";
  applyFilters();
}
</script>
<script src="core.js"></script>
</body>
</html>
